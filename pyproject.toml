[project]
name = "mixcloud-mcp"
version = "0.1.0"
description = "FastMCP server bridging the Mixcloud API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixcloud_mcp"]

[tool.uv.scripts]
start = "python -m mixcloud_mcp.stdio"
start-http = "python -m mixcloud_mcp.http"
inspect = "fastmcp dev inspector src/mixcloud_mcp/server.py:mcp"
keygen = "python -c \"import secrets; print(secrets.token_hex(32))\""
